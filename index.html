<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas Agro & Logística - Rastreamento GPS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        agro: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .card-agro { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .input-agro { background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.75rem; padding: 0.75rem 0.75rem 0.75rem 2.5rem; width: 100%; outline: none; }
        .input-agro:focus { border-color: #22c55e; }
        .btn-agro { background-color: #16a34a; color: white; font-weight: bold; border-radius: 0.75rem; padding: 1rem; width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-agro:hover { background-color: #22c55e; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-8">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-agro-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    <i class="fa-solid fa-truck-ramp-box"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">AgroRota GPS</h1>
                    <p class="text-xs text-slate-400">Controle de Frota & Logística</p>
                </div>
            </div>
            <div id="gpsStatusBadge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-700 text-slate-300 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span>GPS Desconectado</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto w-full px-4 pt-4 flex-1 space-y-4">

        <!-- Banner de Alerta -->
        <div id="alertBox" class="hidden p-4 rounded-xl border flex items-start gap-3 transition-all">
            <i id="alertIcon" class="fa-solid fa-circle-info mt-0.5 text-lg"></i>
            <div class="flex-1 text-sm" id="alertMessage"></div>
            <button onclick="hideAlert()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- CARD 1: Formulário de Início -->
        <section id="formSection" class="card-agro">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-play text-agro-500"></i> Iniciar Nova Rota
            </h2>

            <form id="startRouteForm" class="space-y-4" onsubmit="event.preventDefault(); startTracking();">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Colaborador *</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-500"></i>
                        <select id="inputColaborador" required class="input-agro">
                            <option value="">Selecione o
