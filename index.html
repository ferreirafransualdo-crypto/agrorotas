<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroRota GPS - Logística & Gestão em Pastas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        agro: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .card-agro { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .input-agro { background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.75rem; padding: 0.75rem 0.75rem 0.75rem 2.5rem; width: 100%; outline: none; }
        .input-agro:focus { border-color: #22c55e; }
        .btn-agro { background-color: #16a34a; color: white; font-weight: bold; border-radius: 0.75rem; padding: 1rem; width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; border: none; }
        .btn-agro:hover { background-color: #22c55e; }
        #reportCardToImage { width: 100% !important; max-width: 420px !important; margin: 0 auto; box-sizing: border-box; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-8">
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-agro-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    <i class="fa-solid fa-truck-ramp-box"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">AgroRota GPS</h1>
                    <p class="text-xs text-slate-400">Operadores & Gestão Sincronizados</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <div id="netStatusBadge" onclick="sincronizarAgora()" title="Toque para sincronizar agora" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-700 text-slate-300 text-[10px] font-medium cursor-pointer">
                    <span id="netDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span id="netText">Modo Local</span>
                </div>
                <div id="gpsStatusBadge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-700 text-slate-300 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span>GPS Desconectado</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 pt-4 flex-1 space-y-4">
        <div id="alertBox" class="hidden p-4 rounded-xl border flex items-start gap-3 transition-all">
            <i id="alertIcon" class="fa-solid fa-circle-info mt-0.5 text-lg"></i>
            <div class="flex-1 text-sm" id="alertMessage"></div>
            <button type="button" onclick="hideAlert()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <section id="loginSection" class="card-agro max-w-md mx-auto mt-8 space-y-5 text-left">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-agro-600/20 border border-agro-500/40 text-agro-400 rounded-2xl mx-auto flex items-center justify-center text-xl mb-2">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Acesso ao Sistema</h2>
                <p class="text-xs text-slate-400">Entre com seu usuário e senha em qualquer celular.</p>
            </div>
            <form id="loginForm" class="space-y-4" onsubmit="event.preventDefault(); validarLoginColaborador();">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Perfil / Usuário *</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-500"></i>
                        <select id="loginColaborador" required class="input-agro">
                            <option value="">Selecione o seu Usuário</option>
                            <optgroup label="Operadores">
                                <option value="Fransualdo">Fransualdo</option>
                                <option value="Lucas">Lucas</option>
                                <option value="Breno">Breno</option>
                                <option value="Guilherme">Guilherme</option>
                                <option value="Kaymerson">Kaymerson</option>
                                <option value="Antônio">Antônio</option>
                            </optgroup>
                            <optgroup label="Gestão">
                                <option value="Coordenador">👨‍💼 José Elton</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Senha / PIN *</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3 top-3.5 text-slate-500"></i>
                        <input type="password" id="loginPin" required maxlength="12" placeholder="Digite sua senha" class="input-agro placeholder-slate-500 tracking-widest font-bold">
                    </div>
                </div>
                <button type="submit" id="btnEntrarLogin" class="btn-agro shadow-lg text-base">
                    <i class="fa-solid fa-right-to-bracket"></i> ENTRAR NO PAINEL
                </button>
            </form>
        </section>

        <div id="coordinatorPanel" class="hidden space-y-4 text-left">
            <div class="bg-slate-800/90 border border-amber-500/40 rounded-xl p-3 flex justify-between items-center text-xs">
                <div class="flex items-center gap-2 text-amber-300">
                    <i class="fa-solid fa-user-tie text-amber-400 text-sm"></i>
                    <span>Painel da Gestão: <strong class="text-white">José Elton</strong></span>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="sincronizarAgora()" class="text-emerald-400 hover:text-emerald-300 font-semibold cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Sincronizar
                    </button>
                    <button type="button" onclick="logoutColaborador()" class="text-slate-400 hover:text-red-400 underline cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
                    </button>
                </div>
            </div>
            <div id="coordinatorCollabFoldersList" class="space-y-3"></div>
        </div>

        <div id="appPanel" class="hidden space-y-4 text-left">
            <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs">
                <div class="flex items-center gap-2 text-slate-300">
                    <i class="fa-solid fa-user-check text-agro-500 text-sm"></i>
                    <span>Sessão Ativa de: <strong id="currentCollabLabel" class="text-white">---</strong></span>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="sincronizarAgora()" class="text-emerald-400 hover:text-emerald-300 font-semibold cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Sincronizar
                    </button>
                    <button type="button" onclick="logoutColaborador()" class="text-slate-400 hover:text-red-400 underline cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
                    </button>
                </div>
            </div>
            <section class="card-agro">
                <form id="startRouteForm" class="space-y-4" onsubmit="event.preventDefault(); startTracking();">
                    <input type="text" id="inputFleet" required placeholder="Ex: Fiorino Álcool" class="input-agro font-bold">
                    <input type="number" step="0.1" id="inputKmStart" required placeholder="KM Inicial" class="input-agro font-semibold text-agro-400">
                    <input type="text" id="inputDestination" required placeholder="Destino / Manobra" class="input-agro">
                    <button type="submit" class="btn-agro shadow-lg text-base">
                        <i class="fa-solid fa-location-arrow"></i> INICIAR RASTREAMENTO GPS
                    </button>
                </form>
            </section>
            <section class="card-agro space-y-3">
                <h3 class="text-base font-bold text-slate-200">Meu Histórico</h3>
                <div id="historyList" class="space-y-2"></div>
            </section>
        </div>
    </main>

    <script>
        const FIREBASE_DB_URL = "";
        const FIREBASE_PROJECT_FALLBACK = "agro-rotas-gps-dcd0d";
        const LISTA_COLABORADORES = ["Fransualdo", "Lucas", "Breno", "Guilherme", "Kaymerson", "Antônio"];
        let activeRoute = null;

        function getCleanDbUrl() {
            const manual = (FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
            if (manual.startsWith("https://")) return manual;
            return FIREBASE_PROJECT_FALLBACK ? `https://${FIREBASE_PROJECT_FALLBACK}-default-rtdb.firebaseio.com` : "";
        }

        function isCloudConfigured() {
            return Boolean(getCleanDbUrl());
        }

        async function cloudGet(path) {
            const baseUrl = getCleanDbUrl();
            if (!baseUrl || !navigator.onLine) return null;
            const resp = await fetch(`${baseUrl}/${path}.json`, { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.json();
        }

        async function cloudPut(path, payload) {
            const baseUrl = getCleanDbUrl();
            if (!baseUrl || !navigator.onLine) return false;
            const resp = await fetch(`${baseUrl}/${path}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return true;
        }

        function parseSafeJson(raw, fallback) {
            if (!raw) return fallback;
            if (typeof raw === "object") return raw;
            try { return JSON.parse(raw); } catch (e) { return fallback; }
        }

        function verificarStatusConexao(cloudOk = false) {
            const dot = document.getElementById("netDot");
            const text = document.getElementById("netText");
            if (!navigator.onLine) {
                dot.className = "w-2 h-2 rounded-full bg-amber-400";
                text.innerText = "Offline";
            } else if (cloudOk) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                text.innerText = "Nuvem Ativa";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-slate-400";
                text.innerText = isCloudConfigured() ? "Aguardando Banco" : "Modo Local";
            }
        }

        async function salvarEstadoColaborador(colab) {
            if (!colab || !isCloudConfigured()) return;
            const payload = {
                pin: localStorage.getItem(`agro_pin_${colab}`) || "",
                history: parseSafeJson(localStorage.getItem(`agro_routes_history_${colab}`), []),
                updatedAt: Date.now()
            };
            try {
                await cloudPut(`agrorota/users/${colab}`, payload);
                verificarStatusConexao(true);
            } catch (e) {
                verificarStatusConexao(false);
            }
        }

        async function sincronizarAgora(silencioso = false) {
            if (!isCloudConfigured() || !navigator.onLine) {
                verificarStatusConexao(false);
                if (!silencioso) showAlert("Sem conexão com a nuvem no momento.", "info");
                return;
            }
            try {
                const cloudRoot = await cloudGet("agrorota");
                verificarStatusConexao(true);
                const users = cloudRoot && cloudRoot.users ? cloudRoot.users : {};
                LISTA_COLABORADORES.forEach(nome => {
                    if (users[nome]) {
                        if (users[nome].pin) localStorage.setItem(`agro_pin_${nome}`, users[nome].pin);
                        if (Array.isArray(users[nome].history)) {
                            localStorage.setItem(`agro_routes_history_${nome}`, JSON.stringify(users[nome].history));
                        }
                    }
                });
                if (localStorage.getItem("agro_session_type") === "coordenador") carregarPainelGestor();
                if (localStorage.getItem("agro_session_type") === "operador") renderHistoricoOperador();
                if (!silencioso) showAlert("Sincronizado com sucesso!", "success");
            } catch (e) {
                verificarStatusConexao(false);
                if (!silencioso) showAlert("Erro ao sincronizar com o Firebase.", "error");
            }
        }

        async function validarLoginColaborador() {
            const colab = document.getElementById("loginColaborador").value;
            const pin = document.getElementById("loginPin").value.trim();
            if (!colab || !pin) return;

            if (colab === "Coordenador") {
                if (pin === "0000" || pin === localStorage.getItem("agro_pin_Coordenador")) {
                    localStorage.setItem("agro_fixed_colaborador", "Coordenador");
                    localStorage.setItem("agro_session_type", "coordenador");
                    document.getElementById("loginSection").classList.add("hidden");
                    document.getElementById("coordinatorPanel").classList.remove("hidden");
                    carregarPainelGestor();
                    sincronizarAgora(true);
                } else {
                    showAlert("Senha do gestor incorreta.", "error");
                }
                return;
            }

            const senhaLocal = localStorage.getItem(`agro_pin_${colab}`);
            if (!senhaLocal || senhaLocal === pin) {
                localStorage.setItem(`agro_pin_${colab}`, pin);
                localStorage.setItem("agro_fixed_colaborador", colab);
                localStorage.setItem("agro_session_type", "operador");
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("appPanel").classList.remove("hidden");
                document.getElementById("currentCollabLabel").innerText = colab;
                renderHistoricoOperador();
                await salvarEstadoColaborador(colab);
            } else {
                showAlert("Senha incorreta para este usuário.", "error");
            }
        }

        function logoutColaborador() {
            localStorage.removeItem("agro_fixed_colaborador");
            localStorage.removeItem("agro_session_type");
            document.getElementById("appPanel").classList.add("hidden");
            document.getElementById("coordinatorPanel").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
        }

        async function startTracking() {
            const colab = localStorage.getItem("agro_fixed_colaborador");
            const fleet = document.getElementById("inputFleet").value.trim();
            const kmStart = parseFloat(document.getElementById("inputKmStart").value) || 0;
            const destination = document.getElementById("inputDestination").value.trim();
            const history = parseSafeJson(localStorage.getItem(`agro_routes_history_${colab}`), []);
            history.push({
                id: Date.now(),
                data: new Date().toLocaleDateString("pt-BR"),
                colaborador: colab,
                fleet,
                kmStart: kmStart.toFixed(1),
                kmFinal: kmStart.toFixed(1),
                destination,
                distance: "0.00"
            });
            localStorage.setItem(`agro_routes_history_${colab}`, JSON.stringify(history));
            await salvarEstadoColaborador(colab);
            renderHistoricoOperador();
            showAlert("Registro salvo!", "success");
        }

        function renderHistoricoOperador() {
            const colab = localStorage.getItem("agro_fixed_colaborador");
            const list = document.getElementById("historyList");
            const history = parseSafeJson(localStorage.getItem(`agro_routes_history_${colab}`), []);
            if (!history.length) {
                list.innerHTML = '<div class="text-xs text-slate-400">Nenhum registro ainda.</div>';
                return;
            }
            list.innerHTML = history.slice().reverse().map(r => `
                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs flex justify-between">
                    <div><strong>${r.destination}</strong> (${r.fleet}) - ${r.data}</div>
                    <div class="text-agro-400 font-bold">${r.distance} KM</div>
                </div>
            `).join("");
        }

        function carregarPainelGestor() {
            const box = document.getElementById("coordinatorCollabFoldersList");
            box.innerHTML = LISTA_COLABORADORES.map(nome => {
                const hist = parseSafeJson(localStorage.getItem(`agro_routes_history_${nome}`), []);
                const km = hist.reduce((acc, item) => acc + (parseFloat(item.distance) || 0), 0);
                return `
                    <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div><strong>${nome}</strong> (${hist.length} registro(s))</div>
                        <div class="text-agro-400 font-bold">${km.toFixed(2)} KM</div>
                    </div>
                `;
            }).join("");
        }

        function showAlert(msg, type) {
            const box = document.getElementById("alertBox");
            const msgEl = document.getElementById("alertMessage");
            msgEl.innerText = msg;
            box.className = `p-4 rounded-xl border flex items-start gap-3 ${type === "error" ? "bg-red-950 border-red-700 text-red-200" : "bg-agro-950 border-agro-700 text-agro-200"}`;
            box.classList.remove("hidden");
        }

        function hideAlert() {
            document.getElementById("alertBox").classList.add("hidden");
        }

        window.onload = function() {
            verificarStatusConexao(false);
            const tipo = localStorage.getItem("agro_session_type");
            const colab = localStorage.getItem("agro_fixed_colaborador");
            if (tipo === "coordenador") {
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("coordinatorPanel").classList.remove("hidden");
                carregarPainelGestor();
            } else if (tipo === "operador" && colab) {
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("appPanel").classList.remove("hidden");
                document.getElementById("currentCollabLabel").innerText = colab;
                renderHistoricoOperador();
            }
            if (isCloudConfigured() && navigator.onLine) sincronizarAgora(true);
        };
    </script>
</body>
</html>
